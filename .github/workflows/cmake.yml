name: "CMake: Build and create .zip bundle"

on:
  push:
  workflow_call:
    outputs:
      blufx_version:
        description: "Version string parsed from blu_fx.h"
        value: ${{ jobs.package.outputs.blufx_version }}

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-lin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build (Ubuntu 20.04 GLIBC baseline)
        run: |
          docker run --rm \
            -u root \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -euxc "
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ca-certificates \
                libgl1-mesa-dev
              cmake -B /work/build-lin -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
              cmake --build /work/build-lin --config ${{ env.BUILD_TYPE }} -j\$(nproc)
              chown -R $(id -u):$(id -g) /work/build-lin
            "

      - name: Verify Linux ELF dependencies
        run: |
          ls -la "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl"
          readelf -d "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl" | grep -E "NEEDED|RPATH|RUNPATH"
          if readelf -d "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl" | grep -q "libglut"; then
            echo "::error::Linux blu_fx.xpl must not carry a hard DT_NEEDED dependency on libglut!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-lin
          path: ${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl
          if-no-files-found: error

  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            mingw-w64 \
            g++-mingw-w64

      - name: Configure and Build (MinGW x86_64)
        run: |
          cmake -G Ninja \
            -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=Toolchain-mingw-w64-x86-64.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          ninja -C build-win -v

      - name: Verify Windows DLL
        run: |
          ls -la "${{ github.workspace }}/build-win/win_x64/blu_fx.xpl"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-win
          path: ${{ github.workspace }}/build-win/win_x64/blu_fx.xpl
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build Universal Binary (arm64 + x86_64)
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Verify Mac fat binary architectures
        run: |
          ls -la "${{ github.workspace }}/build/mac_x64/blu_fx.xpl"
          lipo -info "${{ github.workspace }}/build/mac_x64/blu_fx.xpl"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-mac
          path: ${{ github.workspace }}/build/mac_x64/blu_fx.xpl
          if-no-files-found: error

  package:
    needs: [build-lin, build-win, build-mac]
    runs-on: macos-latest
    outputs:
      blufx_version: ${{ steps.resolve_version.outputs.blufx_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve BLU-fx version
        id: resolve_version
        run: |
          BLUFX_VER=$(grep '#define VERSION' blu_fx.h | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$BLUFX_VER" ]]; then
            echo "::error::Could not resolve VERSION from blu_fx.h"
            exit 1
          fi
          echo "BLUFX_VERSION=$BLUFX_VER" >> "$GITHUB_ENV"
          echo "blufx_version=$BLUFX_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved BLU-fx version: $BLUFX_VER"

      - name: Ensure target binary directories exist
        run: |
          mkdir -p build-lin/lin_x64 build-win/win_x64 build/mac_x64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-lin
          path: build-lin/lin_x64

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-win
          path: build-win/win_x64

      - name: Download Mac binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-mac
          path: build/mac_x64

      - name: Assemble release package and ZIP archive
        run: |
          chmod +x deploy/package.sh
          ./deploy/package.sh

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_fx_v${{ env.BLUFX_VERSION }}
          path: build/dist/blu_fx_v${{ env.BLUFX_VERSION }}.zip
          if-no-files-found: error
