name: "CMake: Build and create .zip bundle"

on:
  push:
  workflow_call:
    inputs:
      notarize_mac:
        description: "Sign and notarize macOS binary with Apple Developer ID"
        required: false
        type: boolean
        default: true
    outputs:
      blufx_version:
        description: "Version string parsed from blu_fx.h"
        value: ${{ jobs.package.outputs.blufx_version }}

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-lin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and Build (Ubuntu 20.04 GLIBC baseline)
        run: |
          docker run --rm \
            -u root \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -euxc "
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ca-certificates \
                libgl1-mesa-dev
              cmake -B /work/build-lin -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
              cmake --build /work/build-lin --config ${{ env.BUILD_TYPE }} -j\$(nproc)
              chown -R $(id -u):$(id -g) /work/build-lin
            "

      - name: Verify Linux ELF dependencies
        run: |
          ls -la "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl"
          readelf -d "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl" | grep -E "NEEDED|RPATH|RUNPATH"
          if readelf -d "${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl" | grep -q "libglut"; then
            echo "::error::Linux blu_fx.xpl must not carry a hard DT_NEEDED dependency on libglut!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-lin
          path: ${{ github.workspace }}/build-lin/lin_x64/blu_fx.xpl
          if-no-files-found: error

  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            mingw-w64 \
            g++-mingw-w64

      - name: Configure and Build (MinGW x86_64)
        run: |
          cmake -G Ninja \
            -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=Toolchain-mingw-w64-x86-64.cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          ninja -C build-win -v

      - name: Verify Windows DLL
        run: |
          ls -la "${{ github.workspace }}/build-win/win_x64/blu_fx.xpl"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-win
          path: ${{ github.workspace }}/build-win/win_x64/blu_fx.xpl
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build Universal Binary (arm64 + x86_64)
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Verify Mac fat binary architectures
        run: |
          ls -la "${{ github.workspace }}/build/mac_x64/blu_fx.xpl"
          lipo -info "${{ github.workspace }}/build/mac_x64/blu_fx.xpl"
          ARCHS=$(lipo -archs "${{ github.workspace }}/build/mac_x64/blu_fx.xpl")
          echo "Detected architectures: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
            echo "::error::macOS blu_fx.xpl is not a universal binary (expected x86_64 and arm64, got: $ARCHS)"
            exit 1
          fi

      - name: Sign & Notarize macOS Universal Binary (Apple Developer ID)
        if: inputs.notarize_mac == true
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          PLUGIN="${{ github.workspace }}/build/mac_x64/blu_fx.xpl"

          for var in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing required GitHub secret: $var -- refusing to publish an un-notarized macOS binary!"
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/dev_id.p12"
          NOTARY_ZIP="$RUNNER_TEMP/blu_fx_notarize.zip"
          NOTARY_JSON="$RUNNER_TEMP/notary_result.json"
          NOTARY_ERR="$RUNNER_TEMP/notary_stderr.txt"

          # 1. Decode .p12 certificate into an ephemeral build keychain:
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # 2. Auto-discover Developer ID Application identity from the imported .p12:
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$SIGN_ID" ]]; then
            echo "::error::No 'Developer ID Application' identity found in MACOS_CERT_P12_BASE64!"
            exit 1
          fi
          echo "Signing with identity: $SIGN_ID"

          # 3. Code-sign with hardened runtime & secure timestamp:
          codesign --force --timestamp --options=runtime --sign "$SIGN_ID" "$PLUGIN"
          codesign --verify --strict --verbose=2 "$PLUGIN"
          codesign -dvv "$PLUGIN" 2>&1 | grep -E "Authority=|TeamIdentifier=|Timestamp=|Signature="

          # 4. Submit standalone .xpl (zipped) to Apple Notary Service and fail loudly if not Accepted:
          ditto -c -k --keepParent "$PLUGIN" "$NOTARY_ZIP"
          set +e
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --output-format json > "$NOTARY_JSON" 2> "$NOTARY_ERR"
          NOTARY_RC=$?
          set -e

          cat "$NOTARY_JSON" || true
          cat "$NOTARY_ERR" || true

          STATUS=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status",""))' "$NOTARY_JSON" 2>/dev/null || true)
          SUB_ID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("id",""))' "$NOTARY_JSON" 2>/dev/null || true)

          if [[ $NOTARY_RC -ne 0 || "$STATUS" != "Accepted" ]]; then
            echo "::error::Apple notarization FAILED (rc=$NOTARY_RC, status='$STATUS'). If Apple updated its Developer Program License Agreement, sign in at https://developer.apple.com/account, accept it, and re-run!"
            if [[ -n "$SUB_ID" ]]; then
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi
          echo "Apple notarization ACCEPTED (submission id: $SUB_ID)!"

      - name: Clean up temporary signing keychain
        if: always() && inputs.notarize_mac == true
        run: |
          rm -f "$RUNNER_TEMP/dev_id.p12" "$RUNNER_TEMP/blu_fx_notarize.zip" "$RUNNER_TEMP/notary_result.json" "$RUNNER_TEMP/notary_stderr.txt"
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-mac
          path: ${{ github.workspace }}/build/mac_x64/blu_fx.xpl
          if-no-files-found: error

  package:
    needs: [build-lin, build-win, build-mac]
    runs-on: macos-latest
    outputs:
      blufx_version: ${{ steps.resolve_version.outputs.blufx_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve BLU-fx version
        id: resolve_version
        run: |
          BLUFX_VER=$(grep '#define VERSION' blu_fx.h | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ -z "$BLUFX_VER" ]]; then
            echo "::error::Could not resolve VERSION from blu_fx.h"
            exit 1
          fi
          echo "BLUFX_VERSION=$BLUFX_VER" >> "$GITHUB_ENV"
          echo "blufx_version=$BLUFX_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved BLU-fx version: $BLUFX_VER"

      - name: Ensure target binary directories exist
        run: |
          mkdir -p build-lin/lin_x64 build-win/win_x64 build/mac_x64

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-lin
          path: build-lin/lin_x64

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-win
          path: build-win/win_x64

      - name: Download Mac binary
        uses: actions/download-artifact@v4
        with:
          name: binaries-mac
          path: build/mac_x64

      - name: Assemble release package and ZIP archive
        run: |
          chmod +x deploy/package.sh
          ./deploy/package.sh

      - name: Upload packaging artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_fx_v${{ env.BLUFX_VERSION }}
          path: build/dist/blu_fx_v${{ env.BLUFX_VERSION }}.zip
          if-no-files-found: error
